# WildFly 42 uses SmallRye Config 4.0.0. Higher ordinal wins:
#   400  Java system properties (SysPropConfigSource)
#   300  environment variables (EnvConfigSource)
#   100  this file (PropertiesConfigSource)
# @ConfigProperty defaultValue is used only when no source defines the property.
# JWT_SECRET and OPENAI_API_KEY are intentionally absent: set them in the environment.
# Do not set them to an empty string; SmallRye treats that as a missing converted value.
JWT_EXPIRATION_MS=86400000
OPENAI_MODEL=gpt-4o-mini
OPENAI_BASE_URL=https://api.openai.com/v1
CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
