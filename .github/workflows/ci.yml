name: CI

on:
  pull_request:
    paths:
      - backend-jakarta/**
      - backend/src/main/resources/db/migration/**
      - frontend/**

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-latest
    outputs:
      jakarta: ${{ steps.filter.outputs.jakarta }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter application paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            jakarta:
              - 'backend-jakarta/**'
              - 'backend/src/main/resources/db/migration/**'
            frontend:
              - 'frontend/**'

  jakarta:
    name: Build Jakarta image
    needs: changes
    if: needs.changes.outputs.jakarta == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Jakarta image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend-jakarta/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          provenance: false
          sbom: false
          tags: smarttrans-jakarta:${{ github.sha }}

  frontend:
    name: Build frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          provenance: false
          sbom: false
          tags: smarttrans-frontend:${{ github.sha }}
