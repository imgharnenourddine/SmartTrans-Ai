services:
  postgres:
    image: postgres:16-alpine
    container_name: smarttrans-postgres
    environment:
      POSTGRES_DB: smarttrans
      POSTGRES_USER: smarttrans
      POSTGRES_PASSWORD: smarttrans
    ports:
      - "5432:5432"
    volumes:
      - smarttrans_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttrans -d smarttrans"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smarttrans_pg_data:
