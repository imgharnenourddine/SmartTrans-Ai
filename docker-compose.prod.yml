services:
  postgres:
    image: postgres:16-alpine
    container_name: smarttrans-prod-postgres
    environment:
      POSTGRES_DB: smarttrans
      POSTGRES_USER: ${DATABASE_USERNAME:-smarttrans}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-smarttrans}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - smarttrans_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d smarttrans"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: smarttrans-prod-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/smarttrans
      DATABASE_USERNAME: ${DATABASE_USERNAME:-smarttrans}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-smarttrans}
      JWT_SECRET: ${JWT_SECRET:-SmartTransAiProdSecretKeyMustBeAtLeast256BitsLong!!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:8088,http://127.0.0.1:8088}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@smarttrans.ai}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-Password1!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  web:
    build:
      context: ./frontend
    container_name: smarttrans-prod-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  smarttrans_prod_pg_data:
